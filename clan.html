<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clans — What Happened</title>
  <link rel="icon" type="image/png" href="mainimage/upgrades/argoonion.png">
  <link rel="stylesheet" href="clans.css">
</head>
<body>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;gap:8px;align-items:center">
        <button id="tabClansBtn" class="btn" style="background:#164;color:#fff;padding:6px 10px;border-radius:6px">CLANS</button>
        <button id="tabEventsBtn" class="btn" style="padding:6px 10px;border-radius:6px">EVENTS</button>
        <button id="tabShopBtn" class="btn" style="padding:6px 10px;border-radius:6px">CLAN SHOP</button>
      </div>
      <div><a href = "index.html"><button id="backToGameBtn" class="btn">Back to game</button></a></div>
    </div>
    <p class="muted">Create or join clans, view members and clan chat. Clans unlock after your first prestige.</p>

    <div id="tabClans" style="display:block">
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <div id="createArea" style="flex:1;min-width:320px">
        <div style="margin-bottom:8px"><strong>Your account</strong> <span id="meName" class="muted"></span></div>
        <div id="playerClanStatus" class="muted" style="margin-bottom:8px"></div>
        <div style="display:flex;gap:6px;margin-bottom:8px"><button id="ensureNameBtn" class="btn">Set/Check Username</button><button id="openQuickChat" class="btn">Open Global Chat</button><button id="openQuickClan" class="btn">Open Clan Quick</button></div>
        <div style="margin-top:6px;padding:8px;background:#0c0c0f;border-radius:6px;border:1px solid #111">
          <div style="margin-bottom:6px"><strong>Create Clan</strong></div>
          <div style="display:flex;gap:6px"><input id="newClanName" placeholder="Clan name" style="flex:1"><button id="createClan" class="btn orange">Create (10 Golden)</button></div>
          <div class="muted" style="margin-top:6px">You must have prestiged at least once and pay 10 Golden What Happeneds to create a clan.</div>
        </div>
      </div>

      <div id="findArea" style="flex:1;min-width:320px">
        <div style="margin-bottom:8px"><strong>Find clans</strong></div>
        <div style="display:flex;gap:6px;margin-bottom:8px"><input id="searchClanName" placeholder="Search name"><button id="searchClanBtn" class="btn">Search</button></div>
        <div id="searchResults" style="max-height:320px;overflow:auto;background:#0c0c0f;padding:8px;border-radius:6px;border:1px solid #111"></div>
      </div>
    </div>

    <hr style="border:none;border-top:1px solid #222;margin:12px 0">

    <div id="clanDetailArea">
      <!-- Filled dynamically -->
    </div>

    </div>

    <div id="tabEvents" style="display:none;margin-top:12px">
      <div class="muted">No events yet. Coming soon.</div>
    </div>

    <div id="tabShop" style="display:none;margin-top:12px">
      <div class="muted">Clan shop coming soon.</div>
    </div>

    <div style="margin-top:12px;text-align:right"><a href = "index.html"><button id="backToGameBtn2" class="btn">Back to game</button></a></div>
  </div>

  <script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, setDoc, doc, getDoc, updateDoc, arrayUnion, arrayRemove, query, where, orderBy, limit, getDocs, serverTimestamp, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDkrNV4bQgRHzGJ__9XqHzry7xbYuH8IuU",
    authDomain: "whleaderboard.firebaseapp.com",
    projectId: "whleaderboard",
    storageBucket: "whleaderboard.firebasestorage.app",
    messagingSenderId: "602999414155",
    appId: "1:602999414155:web:541f51b97db8358be4638e",
    measurementId: "G-C2FWNR7288"
  };
  try{ if(!getApps().length) initializeApp(firebaseConfig); }catch(e){}
  const db = getFirestore();
  // Expose common Firestore helpers to the global scope so non-module scripts (e.g., main.js)
  // can access the same Firestore instance and functions when this page is loaded.
  try{
    window.db = db;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.setDoc = setDoc;
    window.addDoc = addDoc;
    window.collection = collection;
    window.getDoc = getDoc;
    window.getDocs = getDocs;
    window.onSnapshot = onSnapshot;
    window.arrayUnion = arrayUnion;
    window.arrayRemove = arrayRemove;
    window.serverTimestamp = serverTimestamp;
  }catch(e){}
  // Local helper: escape HTML to prevent XSS and ensure availability in this module
  function escapeHtml(s){ try{ return String(s).replace(/[&<>'"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":"&#39;",'"':'&quot;' })[c]); }catch(e){ return String(s||''); } }
  window.currentChatUnsub = null;
  let currentClanUnsub = null;
  async function fetchProfileByName(uname){
    try{ if(!uname) return {}; const ref = doc(db,'profiles',uname); const s = await getDoc(ref); if(!s.exists()) return {}; return s.data(); }catch(e){ return {}; }
  }
  async function kickMember(clanId, uname, reason){
    try{
      const me = localStorage.getItem('player_username')||'';
      if(!me) return alert('You must be signed in');
      const cRef = doc(db,'clans',clanId);
      await updateDoc(cRef, { members: arrayRemove(uname), leaders: arrayRemove(uname) });
      // write kicked message to profile so the kicked client can see it
      try{
        await setDoc(doc(db,'profiles',uname), { clanId: null, clanName: null, clanRole: null, kickedMessage: (reason||null), kickedAt: serverTimestamp() }, { merge: true });
      }catch(e){
        await setDoc(doc(db,'profiles',uname), { clanId: null, clanName: null, clanRole: null }, { merge: true });
      }
      if(uname === me){ localStorage.removeItem('player_clanId'); localStorage.removeItem('player_clanName'); localStorage.removeItem('player_clanRole'); try{ updatePlayerClanStatus(); }catch(e){} }
      alert('Member kicked.');
      loadClanDetail(clanId);
    }catch(e){ console.error('kick failed', e); alert('Kick failed'); }
  }

  let currentProfileUnsub = null;
  function normalizeNumericField(v){ try{ if(v==null) return 0; if(typeof v === 'object'){ if(typeof v.toNumber === 'function') return Number(v.toNumber()); if(typeof v.toString === 'function') return Number(v.toString()); return 0; } return Number(v) || 0; }catch(e){return 0} }
  function formatScientific(n){ try{ const num = normalizeNumericField(n); if(!isFinite(num) || num === 0) return '0'; return Number(num).toExponential(2); }catch(e){ return String(n||0); } }
  // Helper to read numeric fields from profile documents where different keys may be used
  function profileNumeric(p, keys){
    try{ for(const k of keys){ if(p && typeof p[k] !== 'undefined' && p[k] !== null) return normalizeNumericField(p[k]); } }catch(e){}
    return 0;
  }
  function watchMyProfile() {
    try {
      const username = localStorage.getItem('player_username') || '';
      if (!username) return;
      try { if (currentProfileUnsub) { currentProfileUnsub(); currentProfileUnsub = null; } } catch (e) {}
      const ref = doc(db, 'profiles', username);
      currentProfileUnsub = onSnapshot(ref, snap => {
        try {
          if (!snap.exists()) {
            localStorage.removeItem('player_clanId');
            localStorage.removeItem('player_clanName');
            localStorage.removeItem('player_clanRole');
            updatePlayerClanStatus();
            const area = document.getElementById('clanDetailArea');
            if (area) area.innerHTML = 'You are not in a clan.';
            return;
          }
          const data = snap.data();
          const cid = data.clanId || null;
          if (!cid) {
            let msg = '';
            try {
              msg = (data.kickedMessage || '') + '';
              if (msg && msg.trim()) {
                try { alert('You were kicked from your clan!\n' + msg); } catch (e) {}
                try { updateDoc(doc(db, 'profiles', username), { kickedMessage: null, kickedAt: null }); } catch (e) {}
              }
            } catch (e) {}
            localStorage.removeItem('player_clanId'); localStorage.removeItem('player_clanName'); localStorage.removeItem('player_clanRole');
            updatePlayerClanStatus();
            const area = document.getElementById('clanDetailArea');
            if (area) area.innerHTML = (msg && msg.trim()) ? 'You were kicked from the clan.' : 'You were removed from the clan.';
          } else {
            localStorage.setItem('player_clanId', cid);
            if (typeof data.clanName !== 'undefined') localStorage.setItem('player_clanName', data.clanName || '');
            if (typeof data.clanRole !== 'undefined') localStorage.setItem('player_clanRole', data.clanRole || '');
            updatePlayerClanStatus();
          }
        } catch (e) { console.warn('profile snapshot error', e); }
      }, err => { console.warn('profile snapshot failed', err); });
    } catch (e) {}
  }

  // Profile title cache/helper for clan page
  const _clanProfileTitleCache = {};
  async function getProfileTitlesForClan(names){
    try{
      const out = {};
      const toFetch = [];
      for(const n of (names||[])){
        const raw = String(n||'');
        const key = raw.toLowerCase();
        if(_clanProfileTitleCache.hasOwnProperty(key)) out[key] = _clanProfileTitleCache[key] || '';
        else toFetch.push({ rawName: raw, cacheKey: key });
      }
      await Promise.all(toFetch.map(async item=>{
        const name = item.rawName;
        const cacheKey = item.cacheKey;
        try{
          const s = await getDoc(doc(db,'profiles',name));
          const t = (s && s.exists() && s.data() && s.data().title) ? String(s.data().title||'') : '';
          _clanProfileTitleCache[cacheKey]=t||'';
          out[cacheKey]=_clanProfileTitleCache[cacheKey];
        }catch(e){ _clanProfileTitleCache[cacheKey]=''; out[cacheKey]=''; }
      }));
      return out;
    }catch(e){ return {}; }
  }

  function parseNumberString(s){
    try{
      if(s==null) return 0;
      if(typeof s !== 'string') s = String(s);
      const cleaned = s.replace(/[,\s]/g,'').replace(/[^0-9eE.+-]/g,'');
      const n = Number(cleaned);
      return Number.isFinite(n) ? n : 0;
    }catch(e){ return 0; }
  }

  function readGoldenCount(){
    try{ if(typeof window.getGoldenCountNumber === 'function'){ const v=Number(window.getGoldenCountNumber()); if(Number.isFinite(v)) return v; } }catch(e){}
    try{ const raw = localStorage.getItem('whathappened_golden'); const v = parseNumberString(raw); if(v>0) return v; }catch(e){}
    try{ const el = document.getElementById('goldenCount'); if(el && el.textContent){ const v = parseNumberString(el.textContent); if(v>0) return v; } }catch(e){}
    try{ if(window.opener && window.opener.document){ const el2 = window.opener.document.getElementById('goldenCount'); if(el2 && el2.textContent){ const v = parseNumberString(el2.textContent); if(v>0) return v; } } }catch(e){}
    try{
      const rawSave = localStorage.getItem('whathappened_save') || localStorage.getItem('whathappened_save_v1');
      if(rawSave){
        try{
          const s = JSON.parse(rawSave || '{}');
          const g1 = (typeof s.goldenWhat !== 'undefined') ? parseNumberString(s.goldenWhat) : 0;
          const g2 = (typeof s.totalGoldenEver !== 'undefined') ? parseNumberString(s.totalGoldenEver) : 0;
          const best = Math.max(g1, g2 || 0);
          if(best > 0) return best;
        }catch(e){}
      }
    }catch(e){}
    return 0;
  }

  function ensureUsername(){
    try{
      let u = localStorage.getItem('player_username') || '';
      u = (u || '').trim().slice(0,32);
      if (!u) {
        u = (prompt('Choose a username (max 32):','')||'').trim().slice(0,32);
        if (!u) return null;
        localStorage.setItem('player_username', u);
      }
      const el = document.getElementById('meName'); if(el) el.textContent = u ? (' — ' + u) : '';
      return u;
    }catch(e){return null}
  }

  function updatePlayerClanStatus(){
    try{
      const status = document.getElementById('playerClanStatus');
      const me = localStorage.getItem('player_username') || '';
      const cid = localStorage.getItem('player_clanId');
      const cname = localStorage.getItem('player_clanName') || '';
      const role = localStorage.getItem('player_clanRole') || '';
      if(!status) return;
      if(!me){ status.textContent = 'No username set.'; return; }
      if(cid){
        const label = role ? (role.charAt(0).toUpperCase() + role.slice(1)) : 'Member';
        status.innerHTML = `In clan: <strong style="color:#9cf">${escapeHtml(cname||cid)}</strong> — ${escapeHtml(label)}`;
      } else {
        status.textContent = 'Not in a clan.';
      }
      // hide create/find UI when in a clan
      try{ const ca = document.getElementById('createArea'); if(ca) ca.style.display = cid ? 'none' : ''; const fa = document.getElementById('findArea'); if(fa) fa.style.display = cid ? 'none' : ''; }catch(e){}
    }catch(e){ }
  }

  async function createClan(){
    try{
      const username = ensureUsername(); if(!username){ alert('You must set a username.'); return; }
      const p = Number(localStorage.getItem('whathappened_prestige_times') || 0) || 0;
      if (p < 1) { alert('Clans unlock after you prestige once.'); return; }
      const have = readGoldenCount();
      if (Number(have) < 10) { alert('You need 10 Golden What Happeneds to start a clan.'); return; }
      const nameInp = document.getElementById('newClanName'); if(!nameInp) return; const cname = (nameInp.value||'').trim().slice(0,64);
      if (!cname) { alert('Enter a clan name.'); return; }
      if(!confirm(`Create clan "${cname}" for 10 Golden What Happend?`)) return;
      try{ const newVal = Math.max(0, readGoldenCount() - 10); try{ localStorage.setItem('whathappened_golden', String(newVal)); }catch(e){} try{ const el = document.getElementById('goldenCount'); if(el) el.textContent = String(newVal); }catch(e){} }catch(e){}
      const docRef = await addDoc(collection(db,'clans'), { name: cname, owner: username, members: [username], leaders: [username], createdAt: serverTimestamp(), maxMembers: 30 });
      localStorage.setItem('player_clanId', docRef.id);
      try{ await setDoc(doc(db,'profiles',username), { clanId: docRef.id, clanName: cname, clanRole: 'leader' }, { merge: true }); }catch(e){}
      alert('Clan created.');
      nameInp.value = '';
      loadClanDetail(docRef.id);
    }catch(e){ console.error('createClan failed', e); alert('Create failed'); }
  }

  async function joinClan(clanId){
    try{
      const username = ensureUsername(); if(!username) return alert('Set username first');
      const p = Number(localStorage.getItem('whathappened_prestige_times') || 0) || 0;
      if (p < 1) { alert('Clans unlock after you prestige once.'); return; }
      const clanRef = doc(db,'clans',clanId);
      const snap = await getDoc(clanRef);
      if(!snap.exists()) { alert('Clan not found'); return; }
      const data = snap.data();
      const members = Array.isArray(data.members) ? data.members : [];
      if(members.includes(username)) { alert('You are already a member.'); return; }
      if(members.length >= (data.maxMembers || 30)) { alert('Clan is full.'); return; }
      await updateDoc(clanRef, { members: arrayUnion(username) });
      try{ await addDoc(collection(db,'clan_chat'), { clanId, name: 'SYSTEM', message: `${username} joined the clan!`, createdAt: serverTimestamp(), system: true, color: 'green', scrollToBottom: true }); }catch(e){}
      await setDoc(doc(db,'profiles',username), { clanId: clanId, clanName: data.name, clanRole: 'member' }, { merge: true });
      localStorage.setItem('player_clanId', clanId);
      localStorage.setItem('player_clanName', data.name || '');
      localStorage.setItem('player_clanRole', 'member');
      try{ updatePlayerClanStatus(); }catch(e){}
      alert('Joined clan.');
      loadClanDetail(clanId);
    }catch(e){ console.error('join failed', e); alert('Join failed'); }
  }

  // Attach UI listeners; handle case where script loads after DOMContentLoaded
  function initClanUI(){
    try{
      const ensureBtn = document.getElementById('ensureNameBtn'); if(ensureBtn) ensureBtn.addEventListener('click', ()=>{ ensureUsername(); });
      const openQuickChat = document.getElementById('openQuickChat'); if(openQuickChat) openQuickChat.addEventListener('click', ()=>{ try{ window.open('index.html','_self'); setTimeout(()=>{ const el = document.getElementById('chatToggle'); if(el) el.click(); },200); }catch(e){} });
      const openQuickClan = document.getElementById('openQuickClan'); if(openQuickClan) openQuickClan.addEventListener('click', ()=>{ try{ window.open('index.html','_self'); setTimeout(()=>{ const el = document.getElementById('clanToggle'); if(el) el.click(); },200); }catch(e){} });
      const createBtn = document.getElementById('createClan'); if(createBtn) createBtn.addEventListener('click', createClan);
      const searchBtn = document.getElementById('searchClanBtn'); if(searchBtn) searchBtn.addEventListener('click', searchClans);
      // tab buttons
      try{ const tabClansBtn = document.getElementById('tabClansBtn'); const tabEventsBtn = document.getElementById('tabEventsBtn'); const tabShopBtn = document.getElementById('tabShopBtn'); const tabClans = document.getElementById('tabClans'); const tabEvents = document.getElementById('tabEvents'); const tabShop = document.getElementById('tabShop');
        function showTab(which){ if(!tabClans || !tabEvents || !tabShop) return; tabClans.style.display = which === 'clans' ? 'block' : 'none'; tabEvents.style.display = which === 'events' ? 'block' : 'none'; tabShop.style.display = which === 'shop' ? 'block' : 'none'; try{ tabClansBtn.style.background = which === 'clans' ? '#164' : ''; tabEventsBtn.style.background = which === 'events' ? '#164' : ''; tabShopBtn.style.background = which === 'shop' ? '#164' : ''; }catch(e){} }
        if(tabClansBtn) tabClansBtn.addEventListener('click', ()=> showTab('clans'));
        if(tabEventsBtn) tabEventsBtn.addEventListener('click', ()=> showTab('events'));
        if(tabShopBtn) tabShopBtn.addEventListener('click', ()=> showTab('shop'));
        showTab('clans');
      }catch(e){}
      // show recommended clans on load
      try{ showRecommendedClans(); }catch(e){}
    }catch(e){ console.warn('clans init listeners failed', e); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initClanUI);
  else initClanUI();
  // Apply equipped background (match index.html behavior)
  (function(){
    try{
      const raw = localStorage.getItem('whathappened_save') || localStorage.getItem('whathappened_save_v1');
      if(!raw) return;
      const s = JSON.parse(raw || '{}');
      let bg = (typeof s.equippedBgImage === 'string') ? s.equippedBgImage : null;
      if(!bg) return;
      try{
        if(bg && typeof bg === 'string' && bg.indexOf('/') === -1){
          if(bg.toLowerCase() === 'mainbg.png') bg = 'mainimage/Mainbg.png';
          else if(bg.toLowerCase() === 'vrillbg.png') bg = 'mainimage/Vrillbg.png';
          else bg = 'bgimages/' + bg;
        }
      }catch(e){}
      try{ document.body.style.backgroundImage = "url('" + bg + "')"; }catch(e){}
    }catch(e){}
  })();
  async function loadClanDetail(clanId){
    try{
      const area = document.getElementById('clanDetailArea'); if(area) area.innerHTML = 'Loading...';
      // unsubscribe previous
      try{ if(currentClanUnsub){ currentClanUnsub(); currentClanUnsub = null; } }catch(e){}
      const ref = doc(db,'clans',clanId);
      currentClanUnsub = onSnapshot(ref, async snapLive => {
        try{
          if(!snapLive.exists()){ if(area) area.innerHTML = 'Clan not found.'; return; }
          const c = snapLive.data();
          const owner = c.owner || '';
          const name = c.name || '';
          const members = Array.isArray(c.members) ? c.members.slice(0,100) : [];
            let descriptionText = c.description || '';
            let html = `<div style="display:flex;justify-content:space-between;align-items:center"><div><h2 style="margin:0">${escapeHtml(name)}</h2><div class="muted">Owner: ${escapeHtml(owner)}</div><div id="clanDescription" class="muted" style="margin-top:6px">${escapeHtml(descriptionText)}</div></div>`;
          const me = (localStorage.getItem('player_username')||'');
          if(members.includes(me)) html += `<div id=\"clanHeaderActions\"><button id=\"leaveClanBtn\" class=\"btn\">Leave Clan</button>${me===owner?'<button id=\"deleteClanBtn\" class=\"btn red\" style=\"margin-left:8px\">Delete Clan</button>':''}</div>`;
          else html += `<div id=\"clanHeaderActions\"><button id=\"joinClanBtn\" class=\"btn green\">Join Clan</button>${me===owner?'<button id=\"deleteClanBtn\" class=\"btn red\" style=\"margin-left:8px\">Delete Clan</button>':''}</div>`;
          html += `</div><div style="margin-top:12px;display:flex;flex-direction:column"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Members (${members.length})</strong><button id=\"toggleMembersBtn\" class=\"btn\">Toggle</button></div><div id=\"membersList\" style=\"margin-top:8px;max-height:360px;overflow:auto;background:#0c0c0f;padding:8px;border-radius:6px;border:1px solid #111\"></div></div>`;
          // clan chat: only visible to members
          if (members.includes(me)) {
            html += `<div style=\"margin-top:12px\"><strong>Clan Chat</strong><div id=\"clanChatBox\" style=\"height:220px;overflow:auto;background:#0c0c0f;padding:8px;border-radius:6px;border:1px solid #111;margin-top:6px\"></div><div style=\"display:flex;gap:6px;margin-top:6px\"><input id=\"clanChatInput\" placeholder=\"Message...\" style=\"flex:1\"><button id=\"clanChatSend\" class=\"btn green\">Send</button></div></div>`;
          } else {
            html += `<div style=\"margin-top:12px\"><strong>Clan Chat</strong><div class=\"muted\">Join the clan to view and send clan messages.</div></div>`;
          }
          if(area) area.innerHTML = html;
          if(members.includes(me)){
            const el = document.getElementById('leaveClanBtn'); if(el) el.addEventListener('click', ()=>leaveClan(clanId));
            const delEl = document.getElementById('deleteClanBtn'); if(delEl) delEl.addEventListener('click', ()=>{ if(confirm('Delete this clan? This cannot be undone.')) deleteClan(clanId); });
          } else {
            const el = document.getElementById('joinClanBtn'); if(el) el.addEventListener('click', ()=>joinClan(clanId));
            const delEl = document.getElementById('deleteClanBtn'); if(delEl) delEl.addEventListener('click', ()=>{ if(confirm('Delete this clan? This cannot be undone.')) deleteClan(clanId); });
          }

          // load profiles and render
          const profilesCol = collection(db,'profiles');
          const q = query(profilesCol, where('clanId','==',clanId), limit(200));
          const snap = await getDocs(q);
          const listEl = document.getElementById('membersList'); if(listEl) listEl.innerHTML = '';
          const rows = [];
          snap.forEach(ps => { const p = ps.data(); p._id = ps.id; rows.push(p); });
          rows.sort((a,b)=>{ const na = profileNumeric(a,['score','points','totalScore']); const nb = profileNumeric(b,['score','points','totalScore']); return nb - na; });
          // fetch titles for members
          const names = rows.map(p => String(p.username || p._id || p.name || ''));
          const titles = await getProfileTitlesForClan(names);
          // determine viewer role
          let viewerRole = 'member';
          try{ const meProfileSnap = await getDoc(doc(db,'profiles',me)); if(me === owner) viewerRole = 'leader'; else if(Array.isArray(c.leaders) && c.leaders.indexOf(me)!==-1) viewerRole = 'co-leader'; else if(meProfileSnap && meProfileSnap.exists()) viewerRole = meProfileSnap.data().clanRole || 'member'; }catch(e){}

          for(const p of rows){
            try{
              const uname = String(p.username || p._id || p.name || '');
              let title = titles[uname.toLowerCase()] || '';
              if(!title){ try{ const s = await getDoc(doc(db,'profiles',uname)); if(s && s.exists()) title = String((s.data() && s.data().title) || '') || ''; }catch(e){} }
              const row = document.createElement('div'); row.style.display = 'flex'; row.style.justifyContent = 'space-between'; row.style.padding = '6px 0'; row.style.borderBottom = '1px solid #111';
              const left = document.createElement('div');
              left.innerHTML = `<div><strong style="color:#9cf">${escapeHtml(title ? (title + ' ' + uname) : uname)}</strong><div class="muted" style="font-size:12px">${escapeHtml(p.clanRole||'')}${uname === me ? ' (you)' : ''}</div></div>`;

              // actions depend on viewerRole and target role

                  try{ if(canKick(viewerRole, targetRole, uname === owner)){

                  try{

            const sendBtn = document.getElementById('clanChatSend');
            const inputEl = document.getElementById('clanChatInput');
            if(sendBtn) sendBtn.addEventListener('click', async ()=>{
              try{
                const txt = (inputEl && inputEl.value ? inputEl.value : '').trim();

                if(!txt) return;
                const username = ensureUsername(); if(!username){ alert('Set username first'); return; }
                await addDoc(collection(db,'clan_chat'), { clanId, name: username, message: txt.slice(0,500), createdAt: serverTimestamp(), scrollToBottom: true });
                if(inputEl) inputEl.value = '';
                try { const boxNow = document.getElementById('clanChatBox'); if (boxNow) boxNow.scrollTop = boxNow.scrollHeight; } catch (e) {}
                // allow Enter key to send (handled on input keydown below)
                try{
                  const colRef = collection(db,'clan_chat');
                  const qAll = query(colRef, where('clanId','==',clanId));
                  const snapAll = await getDocs(qAll);
                  if(snapAll && snapAll.size > 100){
                    const msgs = [];
                    snapAll.forEach(s=> msgs.push({ id: s.id, data: s.data() }));
                    msgs.sort((a,b)=>{ const ta = (a.data.createdAt && a.data.createdAt.toDate) ? a.data.createdAt.toDate().getTime() : 0; const tb = (b.data.createdAt && b.data.createdAt.toDate) ? b.data.createdAt.toDate().getTime() : 0; return ta - tb; });
                    const toDelete = msgs.length - 100; const ops = [];
                    for(let i=0;i<toDelete;i++) ops.push(deleteDoc(doc(db,'clan_chat', msgs[i].id)));
                    if(ops.length) await Promise.all(ops);
                  }
                }catch(e){ console.warn('trim clan messages failed', e); }
                try { if (!window.currentChatUnsub) loadClanChat(clanId); } catch (e) {}
              }catch(e){ console.warn('clan send failed', e); alert('Send failed'); }
            });
            // start listening (only for members)
            try{ if (members.includes(me)) loadClanChat(clanId); else { try{ if(typeof window.currentChatUnsub === 'function'){ try{ window.currentChatUnsub(); }catch(e){} window.currentChatUnsub = null; } }catch(e){} } }catch(e){ }

          // header actions: edit description, transfer ownership (permission-checked)
          try{
            const hdr = document.getElementById('clanHeaderActions');
            if(hdr){
              // compute viewer role
              let viewerRoleHdr = 'member';
              try{ const meProf = await getDoc(doc(db,'profiles',me)); if(me === owner) viewerRoleHdr = 'leader'; else if(Array.isArray(c.leaders) && c.leaders.indexOf(me)!==-1) viewerRoleHdr = 'co-leader'; else if(meProf && meProf.exists()) viewerRoleHdr = meProf.data().clanRole || 'member'; }catch(e){}
              if(canEditDescription(viewerRoleHdr)){
                const editBtn = document.createElement('button'); editBtn.className='btn'; editBtn.style.marginLeft='8px'; editBtn.textContent='Edit Description';
                editBtn.addEventListener('click', async ()=>{
                  try{
                    const cur = (c.description||'') + '';
                    const val = prompt('Clan description (visible in search and clan header):', cur) || '';
                    const trimmed = val.trim().slice(0,400);
                    await updateDoc(doc(db,'clans',clanId), { description: trimmed });
                    try{ const descEl = document.getElementById('clanDescription'); if(descEl) descEl.textContent = trimmed; }catch(e){}
                  }catch(er){ console.warn('save clan description failed', er); alert('Save failed'); }
                });
                hdr.appendChild(editBtn);
              }

              if(canTransferOwnership(viewerRoleHdr) && me === owner){
                const transferBtn = document.createElement('button'); transferBtn.className='btn'; transferBtn.style.marginLeft='8px'; transferBtn.textContent='Transfer Ownership';
                transferBtn.addEventListener('click', async ()=>{
                  try{
                    const choice = prompt('Enter username to transfer ownership to (must be member):','')||''; const trimmed = choice.trim(); if(!trimmed) return;
                    if(!members.includes(trimmed)) return alert('User not a member');
                    if(!confirm(`Transfer ownership to ${trimmed}?`)) return;
                    const cRef = doc(db,'clans',clanId);
                    await updateDoc(cRef, { owner: trimmed, leaders: arrayUnion(trimmed) });
                    try{ await setDoc(doc(db, 'profiles', trimmed), { clanRole: 'leader' }, { merge: true }); }catch(e){}
                    try{ await setDoc(doc(db, 'profiles', me), { clanRole: 'co-leader' }, { merge: true }); }catch(e){}
                    alert('Ownership transferred.');
                  }catch(er){ console.warn('transfer failed', er); alert('Transfer failed'); }
                });
                hdr.appendChild(transferBtn);
              }
            }
          }catch(e){}

            // Enter-to-send binding
            try{
              if(inputEl && sendBtn){
                inputEl.addEventListener('keydown', e=>{
                  try{ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendBtn.click(); } }catch(er){}
                });
              }
            }catch(e){ console.warn('enter-to-send bind failed', e); }
          }catch(e){ console.warn('attach chat handlers failed', e); }

        }catch(e){ console.error('clan snapshot render failed', e); }
      });
    }catch(e){ console.error('loadClanDetail failed', e); const area=document.getElementById('clanDetailArea'); if(area) area.textContent = 'Load failed'; }
  }

  // Search clans by name (client-side filter over first N clans)
  async function searchClans(){

      const term = (qInput||'').trim().toLowerCase();
      const resultsEl = document.getElementById('searchResults'); if(!resultsEl) return;
      resultsEl.innerHTML = 'Searching...';
      const col = collection(db, 'clans');
      const snap = await getDocs(query(col, limit(200)));
      const arr = [];
      snap.forEach(s => { const d = s.data(); d.id = s.id; arr.push(d); });

  async function leaveClan(clanId){
    try{
      const username = ensureUsername(); if(!username) return;
      // if the leaving user is the owner, transfer leadership before removing them
      const clanRef = doc(db,'clans',clanId);
      const snap = await getDoc(clanRef);
      if(!snap.exists()) { alert('Clan not found'); return; }
      const data = snap.data();
      const owner = data.owner || '';
      // If owner is leaving, try to transfer leadership (or delete if no members remain)
      if(username === owner){
        const remaining = Array.isArray(data.members) ? data.members.filter(m=>m!==username) : [];
        if(!remaining || remaining.length === 0){
          await deleteClan(clanId);
          await setDoc(doc(db,'profiles',username), { clanId: null, clanName: null, clanRole: null }, { merge: true });
          localStorage.removeItem('player_clanId'); localStorage.removeItem('player_clanName'); localStorage.removeItem('player_clanRole');
          try{ updatePlayerClanStatus(); }catch(e){}
          alert('You left and the clan was deleted (no members).');
          const area=document.getElementById('clanDetailArea'); if(area) area.innerHTML = '';
          return;
        } else {
          await transferLeadershipToBestCandidate(clanId, remaining);
        }
      }

      await updateDoc(clanRef, { members: arrayRemove(username), leaders: arrayRemove(username) });
      try{ await addDoc(collection(db,'clan_chat'), { clanId, name: 'SYSTEM', message: `${username} left the clan.`, createdAt: serverTimestamp(), system: true, color: 'red', scrollToBottom: true }); }catch(e){}
      await setDoc(doc(db,'profiles',username), { clanId: null, clanName: null, clanRole: null }, { merge: true });
      localStorage.removeItem('player_clanId');
      localStorage.removeItem('player_clanName');
      localStorage.removeItem('player_clanRole');
      try{ updatePlayerClanStatus(); }catch(e){}
      alert('Left clan.');
      const area=document.getElementById('clanDetailArea'); if(area) area.innerHTML = '';
    }catch(e){ console.error('leave failed', e); alert('Leave failed'); }
  }

  // promotion ranks priority (higher wins)
  const RANK_PRIORITY = { 'leader':5, 'co-leader':4, 'elder':3, 'eleite member':2, 'member':1 };

  function roleRank(role){ return RANK_PRIORITY[(role||'member').toLowerCase()] || 1; }

  function canAssignRole(actorRole, targetNewRole){
    const a = roleRank(actorRole);
    const t = roleRank(targetNewRole);
    if(a >= roleRank('leader')) return true;
    // allow assignment only when actor has strictly higher rank than the target
    return a > t;
  }

  function canKick(actorRole, targetRole, isTargetOwner){
    const a = roleRank(actorRole);
    const t = roleRank(targetRole);
    // only owner/leader can kick owner
    if(isTargetOwner) return a >= roleRank('leader');
    if(a >= roleRank('leader')) return true;
    // otherwise actor must have strictly higher rank than target
    return a > t;
  }

  function canEditDescription(actorRole){ return roleRank(actorRole) >= roleRank('co-leader'); }
  function canChangeName(actorRole){ return roleRank(actorRole) >= roleRank('leader'); }
  function canTransferOwnership(actorRole){ return roleRank(actorRole) >= roleRank('leader'); }
  function canPinMessages(actorRole){ return roleRank(actorRole) >= roleRank('elder'); }

  async function promoteMember(clanId, uname, newRole){
    try{
      const me = localStorage.getItem('player_username')||'';
      if(!me) return alert('You must be signed in');
      const cRef = doc(db,'clans',clanId);
      const cSnap = await getDoc(cRef);
      if(!cSnap.exists()) return alert('Clan not found');
      const c = cSnap.data();
      const myRole = (Array.isArray(c.leaders) && c.leaders.indexOf(me)!==-1) ? 'co-leader' : ((me === c.owner) ? 'leader' : (await (async()=>{ try{ const p = await getDoc(doc(db,'profiles',me)); if(p && p.exists()) return p.data().clanRole || 'member'; }catch(e){} return 'member'; })()));
      if(!canAssignRole(myRole, newRole)) return alert('You do not have permission to assign that role');
      // read previous role
      let prevRole = 'member';
      try{ const ps = await getDoc(doc(db,'profiles',uname)); if(ps && ps.exists()) prevRole = ps.data().clanRole || 'member'; }catch(e){}
      await setDoc(doc(db,'profiles',uname), { clanRole: newRole }, { merge: true });
      try{ if(String(newRole).toLowerCase() === 'co-leader') await updateDoc(cRef, { leaders: arrayUnion(uname) }); else await updateDoc(cRef, { leaders: arrayRemove(uname) }); }catch(e){}
      // announce promotion/demotion in clan chat
      try{
        const isPromotion = roleRank(newRole) > roleRank(prevRole);
        const sysMsg = isPromotion ? `${me} promoted ${uname} to ${newRole}` : `${me} demoted ${uname} to ${newRole}`;
        await addDoc(collection(db,'clan_chat'), { clanId, name: 'SYSTEM', message: sysMsg, createdAt: serverTimestamp(), system: true, color: isPromotion ? 'green' : 'red', scrollToBottom: true });
      }catch(e){}
      alert('Promotion updated.');
      loadClanDetail(clanId);
    }catch(e){ console.error('promote failed', e); alert('Promote failed'); }
  }

  async function deleteClan(clanId){
    try{
      const cRef = doc(db,'clans',clanId);
      const cSnap = await getDoc(cRef);
      if(!cSnap.exists()) return alert('Clan not found');
      const c = cSnap.data();
      const members = Array.isArray(c.members) ? c.members.slice() : [];
      const ops = members.map(m => setDoc(doc(db,'profiles',m), { clanId: null, clanName: null, clanRole: null }, { merge: true }));
      await Promise.all(ops);
      await deleteDoc(cRef);
      try{ const col = collection(db,'clan_chat'); const q = query(col, where('clanId','==',clanId)); const snap = await getDocs(q); const dels=[]; snap.forEach(s=> dels.push(deleteDoc(doc(db,'clan_chat', s.id)))); if(dels.length) await Promise.all(dels); }catch(e){}
      alert('Clan deleted.');
      const area=document.getElementById('clanDetailArea'); if(area) area.innerHTML = '';
    }catch(e){ console.error('deleteClan failed', e); alert('Delete failed'); }
  }

  async function transferLeadershipToBestCandidate(clanId, candidateUsernames){
    try{
      if(!candidateUsernames || candidateUsernames.length===0) return;
      const infos = [];
      for(const u of candidateUsernames){ try{ const s = await getDoc(doc(db,'profiles',u)); if(s.exists()) infos.push({ username: u, role: (s.data() && s.data().clanRole) || 'member' }); else infos.push({ username: u, role: 'member' }); }catch(e){ infos.push({ username: u, role: 'member' }); } }
      let bestPriority = -1; infos.forEach(i => { const p = RANK_PRIORITY[(i.role||'member')] || 1; if(p > bestPriority) bestPriority = p; });
      const topCandidates = infos.filter(i => (RANK_PRIORITY[(i.role||'member')]||1) === bestPriority).map(i=>i.username);
      const chosen = topCandidates[Math.floor(Math.random() * topCandidates.length)]; if(!chosen) return;
      const cRef = doc(db,'clans',clanId); await updateDoc(cRef, { owner: chosen, leaders: arrayUnion(chosen) }); await setDoc(doc(db,'profiles',chosen), { clanRole: 'leader' }, { merge: true });
    }catch(e){ console.error('transfer leadership failed', e); }
  }

  

  async function loadClanChat(clanId){
    try{
      const box = document.getElementById('clanChatBox'); if(!box) return; box.innerHTML = 'Loading...';
      // only allow viewing chat of the clan you belong to
      try{ const myCid = localStorage.getItem('player_clanId') || null; if(String(myCid) !== String(clanId)){ box.innerHTML = '<div class="muted">Join the clan to view messages.</div>'; return; } }catch(e){}
      try{ if(typeof window.currentChatUnsub === 'function'){ try{ window.currentChatUnsub(); }catch(e){} window.currentChatUnsub = null; } }catch(e){}
      const col = collection(db,'clan_chat');
      const q = query(col, where('clanId','==',clanId), limit(200));
      // use global onSnapshot subscription to update in real time
      window.currentChatUnsub = onSnapshot(q, async snap => {
        try{
          // determine if the user is actively viewing this chat pane
          const isViewing = (typeof document !== 'undefined' && document.visibilityState === 'visible' && box.offsetParent !== null && box.clientHeight > 0);
          const wasNearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) <= 50;
          const prevScrollTop = box.scrollTop;
          box.innerHTML = '';
          const msgs = [];
          snap.forEach(s => msgs.push(Object.assign({ id: s.id }, s.data())));
          // sort by time (oldest -> newest). Do not reorder pinned messages.
          msgs.sort((a,b)=>{ const ta = (a.createdAt && a.createdAt.toDate) ? a.createdAt.toDate().getTime() : 0; const tb = (b.createdAt && b.createdAt.toDate) ? b.createdAt.toDate().getTime() : 0; return ta - tb; });
          // determine viewer role (fetch clan doc and profile)
          let viewerRole = 'member';
          try{ const cRef2 = doc(db,'clans',clanId); const cSnap2 = await getDoc(cRef2); const cdata2 = (cSnap2 && cSnap2.exists()) ? cSnap2.data() : {}; const me = localStorage.getItem('player_username')||''; const meProf = await getDoc(doc(db,'profiles',me)); if(me === (cdata2.owner||'')) viewerRole = 'leader'; else if(Array.isArray(cdata2.leaders) && cdata2.leaders.indexOf(me)!==-1) viewerRole = 'co-leader'; else if(meProf && meProf.exists()) viewerRole = meProf.data().clanRole || 'member'; }catch(e){}
          const names = new Set();
          msgs.forEach(m=>{ if(m && !m.system) names.add(String(m.name||'Anon')); });
          const titles = await getProfileTitlesForClan(Array.from(names));
          for(const m of msgs){
            const when = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate().toLocaleString() : '';
            const el = document.createElement('div'); el.style.padding='6px 0';
            if(m.pinned){ el.style.background = 'rgba(255,215,0,0.06)'; el.style.borderRadius = '6px'; }
            try{
              if(m && m.system){
                const color = m.color || 'green';
                el.innerHTML = `<div style=\"color:${escapeHtml(color)};font-weight:600\">${escapeHtml(m.message||'')}</div><div class=\"muted\" style=\"font-size:12px\">${escapeHtml(when)}</div>`;
              } else {
                const nameRaw = String(m.name||'Anon');
                const lkey = nameRaw.toLowerCase();
                let title = (titles[lkey] || '');
                if(!title){ try{ const s = await getDoc(doc(db,'profiles',nameRaw)); if(s && s.exists()) title = String((s.data() && s.data().title) || '') || ''; }catch(e){} }
                const displayName = title ? (escapeHtml(title) + ' ' + escapeHtml(nameRaw)) : escapeHtml(nameRaw);
                const pinBtnHtml = `<span class="pinHolder"></span>`;
                const pinnedByText = m.pinned ? (`Pinned by: ${escapeHtml(m.pinnedBy||'')}`) : '';
                // inline: left = name + message, right = time and pinnedBy
                el.innerHTML = `<div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"display:flex;gap:8px;align-items:center\"><strong style=\"color:#9cf\">${displayName}:</strong> <span>${escapeHtml(m.message||'')}</span></div><div style=\"text-align:right;min-width:140px\"><div class=\"muted\" style=\"font-size:12px\">${escapeHtml(when)}</div><div class=\"muted\" style=\"font-size:12px;margin-top:4px\">${escapeHtml(pinnedByText)}</div>${pinBtnHtml}</div></div>`;
              }
            }catch(e){ el.textContent = String(m.message||''); }
            box.appendChild(el);
            // wire pin/unpin holder (decide visibility asynchronously)
            try{
              const holder = el.querySelector('.pinHolder');
              if(holder){
                (async ()=>{
                  try{
                    const me = localStorage.getItem('player_username')||'';
                    const viewerRankNum = roleRank(viewerRole);
                    // if not pinned: only allow pinning to users who canPin
                    if(!m.pinned){
                      if(!canPinMessages(viewerRole)) { holder.remove(); return; }
                      const btn = document.createElement('button'); btn.className='pinBtn small'; btn.textContent='Pin';
                      btn.addEventListener('click', async ()=>{
                        try{
                          // fetch fresh
                          const id = m.id; const cur = await getDoc(doc(db,'clan_chat', id)); if(!cur || !cur.exists()) return;
                          const meNow = localStorage.getItem('player_username')||'';
                          // store pinner role at time of pin
                          await updateDoc(doc(db,'clan_chat', id), { pinned: true, pinnedBy: meNow, pinnedByRole: viewerRole });
                        }catch(e){ console.warn('pin failed', e); }
                      });
                      holder.appendChild(btn);
                      return;
                    }
                    // if pinned: check if viewer can unpin (equal or higher than pinner)
                    const pinner = m.pinnedBy || '';
                    let pinnerRole = (m.pinnedByRole || 'member');
                    if(!pinnerRole && pinner){ try{ const ps = await getDoc(doc(db,'profiles',pinner)); if(ps && ps.exists()) pinnerRole = ps.data().clanRole || 'member'; }catch(e){} }
                    const pinnerRank = roleRank(pinnerRole);
                    if(viewerRankNum >= pinnerRank || canPinMessages(viewerRole) || roleRank(viewerRole) >= roleRank('leader')){
                      const btn = document.createElement('button'); btn.className='pinBtn small'; btn.textContent='Unpin';
                      btn.addEventListener('click', async ()=>{
                        try{
                          const id = m.id; const cur = await getDoc(doc(db,'clan_chat', id)); if(!cur || !cur.exists()) return;
                          const data = cur.data(); const meNow = localStorage.getItem('player_username')||'';
                          // recompute pinner role if needed
                          const curPinnerRole = data.pinnedByRole || (data.pinnedBy ? ((await (async()=>{ try{ const ps = await getDoc(doc(db,'profiles',data.pinnedBy)); if(ps && ps.exists()) return ps.data().clanRole || 'member'; }catch(e){} return 'member'; })())) : 'member');
                          if(roleRank(viewerRole) >= roleRank(curPinnerRole) || canPinMessages(viewerRole) || roleRank(viewerRole) >= roleRank('leader')){
                            await updateDoc(doc(db,'clan_chat', id), { pinned: false, pinnedBy: null, pinnedByRole: null });
                          } else {
                            alert('You do not have permission to unpin this message');
                          }
                        }catch(e){ console.warn('unpin failed', e); }
                      });
                      holder.appendChild(btn);
                    } else {
                      holder.remove();
                    }
                  }catch(e){ try{ holder.remove(); }catch(_){} }
                })();
              }
            }catch(e){}
          }
          // if user is actively viewing the chat, always scroll to bottom on updates
          const lastMsg = msgs && msgs.length ? msgs[msgs.length - 1] : null;
          if (isViewing) box.scrollTop = box.scrollHeight;
          else if (lastMsg && lastMsg.scrollToBottom) box.scrollTop = box.scrollHeight;
          else if (wasNearBottom) box.scrollTop = box.scrollHeight;
          else box.scrollTop = Math.min(prevScrollTop, Math.max(0, box.scrollHeight - box.clientHeight));
        }catch(e){ console.warn('chat snapshot render failed', e); }
      }, err=>{ console.warn('chat snapshot error', err); });
    }catch(e){ console.warn('load clan chat failed', e); }
  }

  function formatNumber(n){ if(typeof n==='number') return n.toLocaleString(); try{ return Number(n).toLocaleString(); }catch(e){return String(n)} }

  // on load: show current player's clan if any
  (function(){ try{ const me = localStorage.getItem('player_username')||''; if(me){ const el=document.getElementById('meName'); if(el) el.textContent = ' — ' + me; } const cid = localStorage.getItem('player_clanId'); if(cid) loadClanDetail(cid); updatePlayerClanStatus(); try{ watchMyProfile(); }catch(e){} }catch(e){} })();

  // keep status updated when username or clan changes elsewhere
  window.addEventListener('storage', function(e){ if(e.key && (e.key.indexOf('player_clan')===0 || e.key==='player_username')) try{ updatePlayerClanStatus(); }catch(ex){} });

  // --------- Events scheduling (reads from Firestore so you can edit in Firebase Console) ---------
  const EVENT_CONFIG_DOC = doc(db,'events','config');
  const EVENT_STATE_DOC = doc(db,'events','state');
  const EVENT_DURATION = 3 * 24 * 60 * 60 * 1000; // 3 days
  const DOWNTIME_DURATION = 2 * 24 * 60 * 60 * 1000; // 2 days

  async function ensureEventConfig(){
    try{
      const s = await getDoc(EVENT_CONFIG_DOC);
      if(!s.exists()){
        await setDoc(EVENT_CONFIG_DOC, { types: ['Bossfight','ClanVClan clicks','Clan Race','prestige party','construction event','Endless boss'] });
      }
    }catch(e){ console.warn('ensureEventConfig failed', e); }
  }

  function pickRandomEvent(types){ if(!types || !types.length) return 'Bossfight'; return types[Math.floor(Math.random()*types.length)]; }

  async function generateSchedule(startMs, count){
    try{
      await ensureEventConfig();
      const cfgSnap = await getDoc(EVENT_CONFIG_DOC);
      const types = (cfgSnap && cfgSnap.exists() && cfgSnap.data() && Array.isArray(cfgSnap.data().types)) ? cfgSnap.data().types : ['Bossfight'];
      let now = (typeof startMs === 'number') ? startMs : Date.now();
      const items = [];
      let isDowntime = false; // start with an actual event
      for(let i=0;i<count;i++){
        if(!isDowntime){
          const name = pickRandomEvent(types);
          const start = now;
          const end = start + EVENT_DURATION;
          items.push({ name, start, end, isDowntime: false });
          now = end;
        } else {
          const start = now; const end = start + DOWNTIME_DURATION;
          items.push({ name: 'DOWNTIME', start, end, isDowntime: true });
          now = end;
        }
        isDowntime = !isDowntime;
      }
      await setDoc(EVENT_STATE_DOC, { upcoming: items, updatedAt: serverTimestamp() }, { merge: true });
      return items;
    }catch(e){ console.warn('generateSchedule failed', e); return []; }
  }

  async function ensureEventState(){
    try{
      await ensureEventConfig();
      const s = await getDoc(EVENT_STATE_DOC);
      if(!s.exists()){ await generateSchedule(Date.now(), 8); return; }
      const data = s.data() || {};
      const upcoming = Array.isArray(data.upcoming) ? data.upcoming : [];
      const now = Date.now();
      if(upcoming.length === 0){ await generateSchedule(now,8); return; }
      // if the current first event already ended, advance schedule
      if((upcoming[0].end || 0) <= now){
        // find first future item
        let idx = upcoming.findIndex(it => (it.end || 0) > now);
        if(idx === -1){ await generateSchedule(now,8); return; }
        if(idx > 0){
          const remaining = upcoming.slice(idx);
          const lastEnd = remaining.length ? (remaining[remaining.length-1].end || now) : now;
          const more = await generateSchedule(lastEnd, Math.max(0, 8 - remaining.length));
          const newUpcoming = remaining.concat(more || []);
          await setDoc(EVENT_STATE_DOC, { upcoming: newUpcoming, updatedAt: serverTimestamp() }, { merge: true });
        }
      }
    }catch(e){ console.warn('ensureEventState failed', e); }
  }

  function fmtTimeRemaining(ms){
    try{
      let s = Math.max(0, Math.floor(ms/1000));
      const days = Math.floor(s / 86400); s -= days*86400;
      const hrs = Math.floor(s / 3600); s -= hrs*3600;
      const mins = Math.floor(s / 60); s -= mins*60;
      const secs = s;
      const parts = [];
      if(days) parts.push(days + 'd');
      if(hrs) parts.push(hrs + 'h');
      if(mins) parts.push(mins + 'm');
      parts.push(secs + 's');
      return parts.join(' ');
    }catch(e){ return '0s'; }
  }

  function renderEventsTab(state){
    try{
      const area = document.getElementById('tabEvents'); if(!area) return;
      const upcoming = (state && Array.isArray(state.upcoming)) ? state.upcoming : [];
      const now = Date.now();
      // find currently active item
      const current = upcoming.find(it => (it.start || 0) <= now && (it.end || 0) > now) || null;
      // next event (first upcoming with start > now)
      const next = upcoming.find(it => (it.start || 0) > now) || null;
      let html = '<div style="padding:8px">';
      if(current){
        if(current.isDowntime){
          // currently downtime -> show time until next event and its name
          if(next){
            const inMs = Math.max(0, (next.start || 0) - now);
            html += `<div><strong>Downtime</strong> — next event: <strong>${escapeHtml(next.name||'Event')}</strong> in <strong>${escapeHtml(fmtTimeRemaining(inMs))}</strong></div>`;
          } else {
            html += `<div><strong>Downtime</strong> — no scheduled next event.</div>`;
          }
        } else {
          // an event is active now
          const leftMs = Math.max(0, (current.end || 0) - now);
          html += `<div><strong>Current event:</strong> ${escapeHtml(current.name||'Event')} — ends in <strong>${escapeHtml(fmtTimeRemaining(leftMs))}</strong></div>`;
        }
      } else {
        // no current active item, show next event and time until it (if any)
        if(next){
          const inMs = Math.max(0, (next.start || 0) - now);
          html += `<div><strong>Next event:</strong> ${escapeHtml(next.isDowntime ? 'Downtime' : (next.name||'Event'))} in <strong>${escapeHtml(fmtTimeRemaining(inMs))}</strong></div>`;
        } else {
          html += '<div class="muted">No scheduled events.</div>';
        }
      }
      html += '<div style="margin-top:10px"><button id="forceSkipEventBtn" class="btn">Skip to next event (test)</button> <button id="regenScheduleBtn" class="btn">Regenerate schedule now</button></div>';
      html += '</div>';
      area.innerHTML = html;
      try{ const skipBtn = document.getElementById('forceSkipEventBtn'); if(skipBtn) skipBtn.addEventListener('click', ()=>{ try{ window.skipToNextEvent(); }catch(e){} }); const regenBtn = document.getElementById('regenScheduleBtn'); if(regenBtn) regenBtn.addEventListener('click', ()=>{ try{ window.forceGenerateScheduleNow(); }catch(e){} }); }catch(e){}
    }catch(e){ console.warn('renderEventsTab failed', e); }
  }

  // watch state and render
  async function watchEventState(){
    try{
      await ensureEventState();
      try{ if(typeof window.eventStateUnsub === 'function'){ try{ window.eventStateUnsub(); }catch(e){} window.eventStateUnsub = null; } }catch(e){}
      window.eventStateUnsub = onSnapshot(EVENT_STATE_DOC, snap => { try{ const data = snap && snap.exists() ? snap.data() : {}; renderEventsTab(data); }catch(e){ console.warn('event snapshot render failed', e); } });
      // live update countdown every 1s
      setInterval(async ()=>{
        try{ const s = await getDoc(EVENT_STATE_DOC); renderEventsTab(s && s.exists() ? s.data() : {}); }catch(e){}
      }, 1000);
    }catch(e){ console.warn('watchEventState failed', e); }
  }

  // command: skip to next event/downtime (testing) — exposed to window
  window.skipToNextEvent = async function(){
    try{
      const s = await getDoc(EVENT_STATE_DOC);
      const data = s && s.exists() ? s.data() : {};
      const upcoming = Array.isArray(data.upcoming) ? data.upcoming : [];
      if(upcoming.length <= 1){ await generateSchedule(Date.now(), 8); return; }
      // take the second item (the next one) and rebase schedule starting now with its type
      const next = upcoming[1];
      let now = Date.now();
      const newItems = [];
      let isDowntime = !!next.isDowntime;
      for(let i=0;i<8;i++){
        if(isDowntime){
          const start = now; const end = start + DOWNTIME_DURATION;
          newItems.push({ name: 'DOWNTIME', start, end, isDowntime: true });
          now = end;
        } else {
          const name = (i===0 && next && next.name) ? next.name : (await (async ()=>{ const cfg = await getDoc(EVENT_CONFIG_DOC); const types = (cfg && cfg.exists() && cfg.data() && Array.isArray(cfg.data().types)) ? cfg.data().types : ['Bossfight']; return pickRandomEvent(types); })());
          const start = (newItems.length===0) ? Date.now() : now; const end = start + EVENT_DURATION;
          newItems.push({ name, start, end, isDowntime: false });
          now = end;
        }
        isDowntime = !isDowntime;
      }
      await setDoc(EVENT_STATE_DOC, { upcoming: newItems, updatedAt: serverTimestamp() }, { merge: true });
    }catch(e){ console.warn('skipToNextEvent failed', e); }
  };

  window.forceGenerateScheduleNow = async function(){ try{ await generateSchedule(Date.now(),8); }catch(e){ console.warn('forceGenerate failed', e); } };

  // start watching when page loads
  try{ watchEventState(); }catch(e){}
  </script>
