<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>The Wilds — What Happened</title>
        <link rel="icon" type="image/png" href="mainimage/upgrades/argoonion.png">
        <link rel="shortcut icon" href="mainimage/upgrades/argoonion.png">
        <link rel="apple-touch-icon" href="mainimage/upgrades/argoonion.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="theme.css">
        <link rel="stylesheet" href="world.css">
    </head>
    <body data-site-nav="off">
        <canvas id="wCanvas" aria-label="The Wilds: move with WASD, swing your weapon by moving the mouse"></canvas>

        <!-- HUD -->
        <div id="wHud" class="w-hud">
            <div class="w-hud-tl">
                <a class="w-back" href="index.html" title="Back to the clicker">← Game</a>
                <div class="w-bars">
                    <div class="w-bar w-bar--hp" role="meter" aria-label="Health" id="hpBar"><i id="hpFill"></i><span id="hpText">100 / 100</span></div>
                    <div class="w-bar w-bar--st" role="meter" aria-label="Stamina" id="stBar"><i id="stFill"></i></div>
                </div>
                <div class="w-zone" id="zoneName">Wildgate Town</div>
            </div>
            <div class="w-hud-tr">
                <div class="w-rubies" title="Rubies: the currency of the Wilds"><span class="w-ruby" aria-hidden="true"></span><b id="rubyCount">0</b><span class="sr-only"> rubies</span></div>
                <button class="w-online" id="btnOnline" title="Online" aria-label="Online play">🌐 <b id="onlineCount">…</b></button>
                <button class="w-icon-btn" id="btnBag" title="Bag and gear (I)" aria-label="Bag and gear">🎒</button>
                <button class="w-icon-btn" id="btnSkills" title="Classes and abilities (K)" aria-label="Classes and abilities">⚔️</button>
                <button class="w-icon-btn" id="btnMap" title="Map (M)" aria-label="Map">🗺️</button>
                <button class="w-icon-btn" id="btnHelp" title="How to play" aria-label="How to play">❔</button>
                <button class="w-icon-btn" id="btnSettings" title="Settings" aria-label="Settings">⚙️</button>
            </div>
            <canvas id="minimap" class="w-minimap" width="150" height="150" aria-hidden="true"></canvas>
            <div class="w-boss" id="bossBar" hidden>
                <div class="w-boss-name" id="bossName"></div>
                <div class="w-boss-bar"><i id="bossFill"></i></div>
            </div>
            <div class="w-bottom">
                <div class="w-power" id="powerMeter" title="Swing speed: the blade only hurts past the first mark">
                    <i id="powerFill"></i><b class="w-power-min"></b><b class="w-power-full"></b><span>SWING</span>
                </div>
                <div class="w-hotbar" id="hotbar" role="toolbar" aria-label="Hotbar"></div>
            </div>
            <div class="w-prompt" id="prompt" hidden></div>
            <form class="w-chat" id="chatBar" hidden autocomplete="off">
                <input id="chatInput" maxlength="60" placeholder="Say something (Enter to send, Esc to close)" aria-label="Chat message">
                <div class="w-emotes" id="emotes"></div>
            </form>
            <button class="w-icon-btn w-chat-btn" id="btnChat" title="Chat (Enter)" aria-label="Chat">💬</button>
            <div class="w-toasts" id="toasts" role="status" aria-live="polite"></div>
            <div class="w-banner" id="banner" hidden></div>
        </div>

        <!-- touch controls (shown on touch devices) -->
        <div class="w-touch" id="touchUi" hidden>
            <div class="w-stick" id="touchStick"><i id="touchKnob"></i></div>
            <div class="w-touch-btns">
                <button id="tDash" aria-label="Dash">💨</button>
                <button id="tUse" aria-label="Interact">E</button>
                <button id="tShield" aria-label="Hold to block with your shield">🛡️</button>
                <button id="tPotion" aria-label="Drink a potion">🧪</button>
                <button id="tAb0" aria-label="Ability 1" hidden>🌟</button>
                <button id="tAb1" aria-label="Ability 2" hidden>🌟</button>
                <button id="tAb2" aria-label="Ability 3" hidden>🌟</button>
            </div>
        </div>

        <!-- modal shell (inventory, stations, trader, map, help, settings, death, minigames) -->
        <div class="w-modal" id="wModal" hidden>
            <div class="w-modal-panel" id="wModalPanel" role="dialog" aria-modal="true" aria-labelledby="wModalTitle">
                <div class="w-modal-head">
                    <h2 id="wModalTitle"></h2>
                    <button class="modal-close" id="wModalClose" aria-label="Close">✕</button>
                </div>
                <div class="w-modal-body" id="wModalBody"></div>
            </div>
        </div>

        <div class="w-cover" id="tabLock" hidden>
            <div class="glass-panel w-cover-card">
                <h2>The Wilds is open in another tab</h2>
                <p class="muted">Only one tab can play at a time, so nothing gets overwritten.</p>
                <button class="btn btn-primary" id="tabLockTake">Play here instead</button>
                <a class="btn btn-ghost" href="index.html">Back to the game</a>
            </div>
        </div>
        <div class="w-cover" id="loading">
            <div class="w-cover-card"><div class="w-title">The Wilds</div><p class="muted" id="loadingText">Loading…</p></div>
        </div>

        <script src="core/world-data.js"></script>
        <script src="core/world-bridge.js"></script>
        <script src="core/world-logic.js"></script>
        <script src="core/world-combat.js"></script>
        <script src="core/world-craft-score.js"></script>
        <script src="core/world-gen.js"></script>
        <script src="core/world-online.js"></script>
        <script src="core/world-net-tree.js"></script>
        <script src="world-net-dev.js"></script>
        <script src="world-engine.js"></script>
        <script src="world-actors.js"></script>
        <script src="world-craft.js"></script>
        <script src="world-ui.js"></script>
        <script src="world-online.js"></script>
        <script src="world.js"></script>
    </body>
</html>
