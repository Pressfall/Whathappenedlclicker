<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Global Leaderboard — What Happened</title>
        <link rel="icon" type="image/png" href="mainimage/upgrades/argoonion.png">
        <link rel="shortcut icon" href="mainimage/upgrades/argoonion.png">
        <link rel="apple-touch-icon" href="mainimage/upgrades/argoonion.png">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7259344384263515" crossorigin="anonymous"></script>
        <style>
            /* Casino vibe: dark, warm red background with subtle grain and neon title */
            :root{--gold:#d4af37;--felt:#0b5f2b;--card:#1b1b1f;--accent:#8b0000}
            html,body{height:100%;}
            body {
                margin:0;padding:28px;font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#0b3b1f 0%, #0a2b17 60%, #06220f 100%);color:#fff;
                -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
            }
            .casino-wrap{max-width:980px;margin:20px auto;padding:18px}
            .casino-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
            h1.casyno{font-size:36px;margin:0;color:var(--gold);text-shadow:0 0 10px rgba(212,175,55,0.12),0 6px 24px rgba(0,0,0,0.6);letter-spacing:2px}
            .neon{color:#fff;text-shadow:0 0 8px rgba(255,255,255,0.06),0 0 28px rgba(255,140,0,0.06)}
            .jackpot{font-size:13px;color:#ffd;opacity:0.9}
            .card{background:linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.6));border-radius:12px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.02)}
            /* felt table look for the play area */
            .felt{background:linear-gradient(180deg,var(--felt),#084b1f);border-radius:8px;padding:14px;margin-top:12px;box-shadow:inset 0 2px 8px rgba(0,0,0,0.6)}
            .muted{color:#d6d6d6aa;font-size:13px}
            .form-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
            input[type=text], select{padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.25);color:#fff;min-width:120px}
            button{padding:10px 12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(139,0,0,0.2)}
            button.secondary{background:rgba(255,255,255,0.06);color:#fff;box-shadow:none}
            #gameArea{margin-top:12px}
            #playerHand,#dealerHand{min-height:36px;padding:8px;border-radius:6px;background:rgba(0,0,0,0.12);}
            #result{color:var(--gold)}
            .chips{display:flex;gap:6px;align-items:center}
            .chip{width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#fff,#ddd);display:inline-flex;align-items:center;justify-content:center;color:#222;font-weight:800;border:3px solid #222}
            @media (max-width:720px){ .casino-header{flex-direction:column;align-items:flex-start} h1.casyno{font-size:28px} }
        </style>
    </head>
    <body>
        <button onclick="window.location.href='index.html'" style="position:fixed;top:12px;left:12px;z-index:1300;background:#333;color:#fff;padding:8px 10px;border-radius:6px;border:none;">← Back</button>
        <h1>CASINO</h1>
        <div>gamble your What Happeneds, Golden What Happeneds, and Gems (diamonds) here!</div>
        <!-- Persistent dealer banner so dealer is always visible -->
        <div id="casinoDealerBanner" style="display:flex;align-items:center;gap:12px;margin:12px 0;padding:10px;border-radius:8px;background:linear-gradient(180deg,rgba(0,0,0,0.12),rgba(0,0,0,0.18));">
            <img id="casinoDealerImgBanner" src="mainimage/casinoDeal.png" alt="Dealer" style="height:88px;width:auto;border-radius:6px;" onerror="this.style.display='none'" />
            <div style="display:flex;flex-direction:column;">
                <div id="casinoDealerName" style="font-weight:800;color:var(--gold);">The Dealer</div>
                <div id="casinoDealerText" style="color:#ddd;max-width:740px;">Place your bets!</div>
            </div>
        </div>
        <div class="card">
            <div class="form-row">
                <label style="min-width:120px;">Currency</label>
                <select id="betCurrency">
                    <option value="count">What Happeneds</option>
                    <option value="diamonds">Gems</option>
                    <option value="goldenWhat">Golden What Happeneds</option>
                </select>
            </div>
            <div class="form-row">
                <label style="min-width:120px;">Bet Amount</label>
                <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:220px;">
                    <input id="betAmount" type="range" min="0" max="0" value="0" step="1" style="width:33.333vw;max-width:480px;min-width:200px;" aria-label="Bet amount slider">
                    <div id="betAmountDisplay" style="min-width:90px;text-align:center;font-weight:700;color:var(--gold);">0</div>
                </div>
                <button id="btnMaxBet" class="secondary">Max</button>
                <button id="btnPlaceBet">Place Bet & Deal</button>
            </div>
            <div id="balanceRow" class="muted">Loading balance...</div>
            <div id="gambaStats" class="muted" style="margin-top:6px;">CPS: <span id="gambaCps">0</span> | Click Power: <span id="gambaClickPower">1</span></div>
            <hr>
            <div id="gameArea" style="display:none;">
                <div style="display:flex;gap:16px;align-items:flex-start;">
                    <div style="flex:1;">
                        <h3>Player</h3>
                        <div id="playerHand" class="muted"></div>
                        <div id="playerScore"></div>
                    </div>
                    <div style="flex:1;">
                        <h3>Dealer</h3>
                        <div style="display:flex;align-items:center;gap:12px;">
                                <div id="dealerHand" class="muted"></div>
                        </div>
                        <div id="dealerScore"></div>
                    </div>
                </div>
                <div style="margin-top:12px;display:flex;gap:8px;">
                    <button id="btnHit">Hit</button>
                    <button id="btnStand">Stand</button>
                </div>
                <div id="result" style="margin-top:12px;font-weight:700;"></div>
            </div>
            <hr>
            <div class="muted" id="spinSection">
                <h3 style="margin:6px 0 8px 0;color:var(--gold)">Daily Spin</h3>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <div id="spinInfo" class="muted">Spin once per day. Resets at 12:00 AM local time.</div>
                    <button id="btnSpin" style="margin-left:8px;">Spin</button>
                </div>
                <div id="spinResult" style="margin-top:8px;font-weight:700;color:var(--gold)"></div>
                <div id="wheelContainer" style="margin-top:10px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;width:100%;">
                    <div style="flex:0 0 420px;display:flex;justify-content:center;margin:0 auto;">
                        <img id="spinWheel" src="mainimage/wheel.png" alt="spin wheel" style="width:420px;height:420px;display:block;">
                    </div>
                    <div style="flex:1;min-width:180px;">
                        <div class="muted" style="font-size:13px">Spin result will appear here after the wheel stops.</div>
                    </div>
                </div>
            </div>
            </div>
        </div>
        <p id="card"></p>
        <script src="gamba.js"></script>

    </body>
    <script>
        const suits = ['Hearts', 'Diamonds', 'Clubs', 'Spades'];
const ranks = ['2', '3', '4', '5', '6', '7', '8', '9', '10', 'Jack', 'Queen', 'King', 'Ace'];

function createDeck() {
    const deck = [];
    for (const suit of suits) {
        for (const rank of ranks) {
            deck.push({ rank, suit });
        }
    }
    return deck;
}

const standardDeck = createDeck();
    </script>
</html>
