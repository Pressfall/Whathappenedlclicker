<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Achievements — What Happened</title>
  <link rel="icon" type="image/png" href="mainimage/upgrades/argoonion.png">
  <link rel="shortcut icon" href="mainimage/upgrades/argoonion.png">
  <link rel="apple-touch-icon" href="mainimage/upgrades/argoonion.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="consent.css">
  <style>
    body { margin: 0; min-height: 100vh; padding: 72px 18px 40px; background: radial-gradient(ellipse at 50% -10%, #24203a, #0b0d13 60%) fixed; }
    .wrap { max-width: 1040px; margin: 0 auto; }
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    .head p { margin: 0; color: var(--text-dim); }
    .summary { padding: 18px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); display: grid; gap: 12px; margin-bottom: 14px; }
    .sum-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .sum-top b { font-size: 26px; font-variant-numeric: tabular-nums; }
    .sum-top span { color: var(--text-dim); }
    .sum-bar { height: 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); overflow: hidden; }
    .sum-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-deep)); border-radius: inherit; transition: width 0.5s ease; }
    .rarity-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .r-chip { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: rgba(255, 255, 255, 0.05); border: 1px solid currentColor; }
    .equipped { font-size: 13px; color: var(--text-dim); }
    .equipped b { font-weight: 800; }

    .toolbar { position: sticky; top: 62px; z-index: 5; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px; margin-bottom: 14px; border-radius: var(--radius); background: rgba(15, 18, 27, 0.92); backdrop-filter: blur(10px); border: 1px solid var(--border); }
    .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); }
    .seg button { border: none; background: transparent; color: var(--text-dim); font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
    .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
    .cat-chips { display: flex; gap: 6px; flex: 1 1 100%; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .cat-chips::-webkit-scrollbar { display: none; }
    .cat-chips a { padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--text-dim); text-decoration: none; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); white-space: nowrap; }
    .cat-chips a:hover { color: var(--text); border-color: var(--border-strong); }
    #achSearch { flex: 1; min-width: 170px; max-width: 360px; }

    .cat { margin-bottom: 18px; scroll-margin-top: 130px; }
    .cat-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
    .cat-head h2 { margin: 0; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: var(--text); }
    .cat-head span { color: var(--text-dim); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
    .ach { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); }
    .ach.done { border-color: color-mix(in srgb, var(--rc) 55%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--rc) 12%, transparent), transparent 65%), var(--surface-2); }
    .ach.is-new { box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(255, 200, 61, 0.25); }
    .badge { flex: 0 0 48px; width: 48px; height: 48px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(0, 0, 0, 0.35); border: 2px solid var(--border); }
    .ach.done .badge { border-color: var(--rc); box-shadow: 0 0 14px color-mix(in srgb, var(--rc) 40%, transparent); }
    .ach:not(.done) .badge { filter: grayscale(1); opacity: 0.6; }
    .body { flex: 1; min-width: 0; display: grid; gap: 4px; }
    .name { font-weight: 800; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .new-tag { padding: 1px 7px; border-radius: 999px; background: var(--gold); color: #2a1600; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; }
    .desc { font-size: 13px; color: var(--text-dim); }
    .title-line { font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .title-line .t { font-weight: 800; color: var(--rc); }
    .title-line .r { color: var(--text-faint); text-transform: capitalize; }
    .prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .prog .bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .prog .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-deep)); border-radius: inherit; }
    .hint { font-size: 12px; color: var(--text-faint); font-style: italic; }
    .equip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: rgba(255, 255, 255, 0.06); color: var(--text); font-size: 11px; font-weight: 800; }
    .equip:hover { background: rgba(255, 255, 255, 0.14); }
    .equip.on { background: var(--gold); color: #2a1600; border-color: transparent; }
    .empty { padding: 30px; text-align: center; color: var(--text-dim); }
    @media (max-width: 560px) {
      body { padding: 64px 10px 32px; }
      .grid { grid-template-columns: 1fr; }
      .toolbar { top: 58px; }
      #achSearch { flex: 1; }
    }
  </style>
</head>
<body>
  <a class="page-back" href="index.html">← Back to game</a>
  <main class="wrap">
    <header class="head">
      <div>
        <h1 class="page-title">Achievements</h1>
        <p>Every achievement gives a title. Equip one here and it shows above your clicker, in chat and on the leaderboard.</p>
      </div>
    </header>

    <section class="summary" aria-live="polite">
      <div class="sum-top"><b id="achSummary"></b><span id="achSummaryText"></span></div>
      <div class="sum-bar"><i id="achSummaryFill"></i></div>
      <div class="rarity-row" id="rarityRow"></div>
      <div class="equipped" id="equippedLine"></div>
    </section>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="Show">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="done" aria-pressed="false">Unlocked</button>
        <button type="button" data-filter="todo" aria-pressed="false">Locked</button>
      </div>
      <input id="achSearch" type="text" placeholder="Search achievements or titles" autocomplete="off" aria-label="Search achievements">
      <nav class="cat-chips" id="catChips" aria-label="Categories"></nav>
    </div>

    <div id="achList"></div>
  </main>

  <script src="followers-data.js"></script>
  <script src="achievements-data.js"></script>
  <script src="core/consent.js"></script>
  <script src="site.js"></script>
  <script>
    const RARITY_ORDER = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic'];
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const short = n => { n = Number(n) || 0; const u = ['', 'K', 'M', 'B', 'T', 'Q', 'Qi']; let i = 0; while (Math.abs(n) >= 1000 && i < u.length - 1) { n /= 1000; i++; } return (i ? (Math.round(n * 100) / 100) : (Number.isInteger(n) ? n : Math.round(n * 10) / 10)).toLocaleString() + u[i]; };
    let filter = 'all';
    // achievements unlocked since the last visit are highlighted once, then cleared
    const freshKeys = new Set(WHA.newKeys());

    function equipped() { try { return localStorage.getItem('equipped_title') || ''; } catch (e) { return ''; } }
    function setEquipped(t) {
      try { if (t) localStorage.setItem('equipped_title', t); else localStorage.removeItem('equipped_title'); } catch (e) {}
      render();
    }

    function render() {
      const snap = WHA.snapshot();
      try { WHA.checkAll(snap); } catch (e) {}
      const term = document.getElementById('achSearch').value.trim().toLowerCase();
      const eq = equipped();
      const all = WHA.ACHIEVEMENTS;
      const done = all.filter(a => WHA.isUnlocked(a));
      document.getElementById('achSummary').textContent = `${done.length} / ${all.length} unlocked`;
      document.getElementById('achSummaryText').textContent = done.length === all.length ? 'Every single one. What happened?!' : `${Math.round(done.length / all.length * 100)}% complete`;
      document.getElementById('achSummaryFill').style.width = (done.length / all.length * 100) + '%';
      document.getElementById('rarityRow').innerHTML = RARITY_ORDER.map(r => {
        const n = all.filter(a => a.rarity === r).length;
        if (!n) return '';
        return `<span class="r-chip" style="color:${WHA.RARITY_COLORS[r]}">${r[0].toUpperCase() + r.slice(1)} ${done.filter(a => a.rarity === r).length}/${n}</span>`;
      }).join('');
      const eqA = all.find(a => a.title === eq);
      document.getElementById('equippedLine').innerHTML = eq
        ? `Equipped title: <b style="color:${WHA.RARITY_COLORS[(eqA && eqA.rarity) || 'common']}">${esc(eq)}</b> <button type="button" class="equip" data-unequip>Unequip</button>`
        : 'No title equipped. Pick one from an unlocked achievement below.';

      const list = document.getElementById('achList');
      let html = '', chips = '';
      for (const cat of WHA.CATEGORIES) {
        const items = all.filter(a => a.cat === cat.id).filter(a => {
          const got = WHA.isUnlocked(a);
          if (filter === 'done' && !got) return false;
          if (filter === 'todo' && got) return false;
          return !term || (a.name + ' ' + a.desc + ' ' + a.title).toLowerCase().includes(term);
        });
        if (!items.length) continue;
        const catAll = all.filter(a => a.cat === cat.id);
        const catDone = catAll.filter(a => WHA.isUnlocked(a)).length;
        chips += `<a href="#cat-${cat.id}">${cat.icon} ${esc(cat.id)} ${catDone}/${catAll.length}</a>`;
        html += `<section class="cat" id="cat-${cat.id}"><div class="cat-head"><h2>${cat.icon} ${esc(cat.id)}</h2><span>${catDone} / ${catAll.length}</span></div><div class="grid">`;
        for (const a of items) {
          const got = WHA.isUnlocked(a);
          const pr = WHA.progress(a, snap);
          const color = WHA.RARITY_COLORS[a.rarity] || '#bfc7c9';
          const fmt = v => a.unit === 'h' ? (Math.round(v * 10) / 10) + 'h' : short(v);
          let prog;
          if (got) prog = '';
          else if (a.event) prog = `<div class="hint">${esc(a.hint || 'Happens when it happens.')}</div>`;
          else prog = `<div class="prog"><span class="bar"><i style="width:${Math.min(100, pr.value / pr.target * 100)}%"></i></span>${fmt(pr.value)} / ${fmt(pr.target)}</div>`;
          const equipBtn = got ? (eq === a.title ? '<button type="button" class="equip on" data-unequip>Equipped</button>' : `<button type="button" class="equip" data-equip="${esc(a.title)}">Equip</button>`) : '';
          html += `<article class="ach${got ? ' done' : ''}${freshKeys.has(a.key) && got ? ' is-new' : ''}" style="--rc:${color}">
            <div class="badge" aria-hidden="true">${a.badge}</div>
            <div class="body">
              <div class="name">${esc(a.name)}${freshKeys.has(a.key) && got ? '<span class="new-tag">NEW</span>' : ''}</div>
              <div class="desc">${esc(a.desc)}</div>
              <div class="title-line"><span>Title:</span><span class="t">${esc(a.title)}</span><span class="r">${a.rarity}</span>${equipBtn}</div>
              ${prog}
            </div>
          </article>`;
        }
        html += '</div></section>';
      }
      list.innerHTML = html || '<div class="empty">Nothing matches. Try another search.</div>';
      document.getElementById('catChips').innerHTML = chips;
    }

    document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
      filter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      render();
    }));
    document.getElementById('achSearch').addEventListener('input', render);
    document.addEventListener('click', e => {
      const eq = e.target.closest('[data-equip]'), un = e.target.closest('[data-unequip]');
      if (eq) setEquipped(eq.dataset.equip);
      else if (un) setEquipped('');
    });
    window.addEventListener('storage', render);
    render();
    // seen: clear the "new" list (the highlights stay until the page is left)
    WHA.clearNew();
  </script>
</body>
</html>
