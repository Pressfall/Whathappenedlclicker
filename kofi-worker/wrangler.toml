# Cloudflare Worker settings for the Ko-fi webhook (docs/kofi-setup.md).
# Secrets are NOT in this file and must never be: set them with `npx wrangler secret put NAME` (step 3 of the guide).
#   KOFI_VERIFICATION_TOKEN  from ko-fi.com/manage/webhooks > Advanced > Verification Token
#   GCP_SERVICE_ACCOUNT      the whole JSON key file of the Firestore service account
#   EMAIL_PEPPER             any long random text (keys the email hash on unclaimed payments)
#   ADMIN_TOKEN              any long random text (for /admin/resolve)

name = "wh-kofi"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Every minute: answer the game's "collect" and "claim" requests (Firestore kofi_requests). The game writes them to Firestore
# instead of calling this worker, because school networks block *.workers.dev. One small Firestore query a minute when
# nothing is waiting (about 1,440 reads a day of the free 50,000).
[triggers]
crons = ["* * * * *"]

[vars]
FIREBASE_PROJECT_ID = "whleaderboard"
# The site(s) the game runs on, comma separated, exactly as the browser shows them (https://..., no trailing slash).
# Only these may send "claim a payment" requests. Add a custom domain here if the game moves to one.
# http://localhost:8000 is the game run on your own computer (npm start), for testing before you push (8001 when 8000 is
# taken, as the Claude app's preview does); a claim still needs a signed-in account, the transaction id and the payer's
# email, and a collect a signed-in account with a verified email, so they open nothing to anyone else.
ALLOWED_ORIGINS = "https://whathappenedclicker.netlify.app,http://localhost:8000,http://localhost:8001"
